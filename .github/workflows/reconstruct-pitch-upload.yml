name: Reconstruct pitch upload

on:
  push:
    paths:
      - ".upload_ready"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and unpack pitch project
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_chunks/part_*.b64 | base64 -d > /tmp/pitch_inbox_full.zip
          unzip -t /tmp/pitch_inbox_full.zip
          mkdir -p "current projects"
          unzip -o /tmp/pitch_inbox_full.zip -d "current projects"
          rm -rf .upload_chunks .upload_ready
          rm -f .github/workflows/reconstruct-pitch-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Upload pitch inbox project"
          git push
